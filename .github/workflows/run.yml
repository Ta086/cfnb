name: Cloudflare IP Auto Optimize

on:
  schedule:
    - cron: '0 */2 * * *' # 每 2 小时自动运行一次
  workflow_dispatch:      # 允许手动点击按钮触发

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  run-cfnb:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Create config and Run
      env:
        CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
        CF_RECORD_NAME: ${{ secrets.CF_RECORD_NAME }}
      run: |
        cat << 'EOF' > config.json
        {
          "api_token": "$CF_API_TOKEN",
          "zone_id": "$CF_ZONE_ID",
          "records": [
            {
              "name": "$CF_RECORD_NAME",
              "type": "A",
              "ttl": 60,
              "proxied": false
            }
          ],
          "max_ips": 3,
          "tele_token": "",
          "tele_chat_id": ""
        }
        EOF
        
        # 经核对，该项目的启动脚本名称为 cfnb.py，而不是 main.py
        python3 cfnb.py
        {
          "api_token": "$CF_API_TOKEN",
          "zone_id": "$CF_ZONE_ID",
          "records": [
            {
              "name": "$CF_RECORD_NAME",
              "type": "A",
              "ttl": 60,
              "proxied": false
            }
          ],
          "max_ips": 3,
          "tele_token": "",
          "tele_chat_id": ""
        }
        EOF
        
        python main.py
            {
              "name": "$CF_RECORD_NAME",
              "type": "A",
              "ttl": 60,
              "proxied": false
            }
          ],
          "max_ips": 3,
          "tele_token": "",
          "tele_chat_id": ""
        }
        EOF
        
        python main.py
