name: Cloudflare IP Auto Optimize

# 触发条件
于:
  schedule:
    - cron: '0 */2 * * *' # 每 2 小时自动运行一次 (UTC 时间)
  workflow_dispatch:      # 允许手动点击按钮触发

jobs:
  run-cfnb:
    runs-on: ubuntu-latest

    steps:
    # 1. 拉取你的代码
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. 设置 Python 环境
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 3. 安装依赖
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    # 4. 生成配置文件并运行脚本
    - name: Create config.json and Run cfnb
      env:
        CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
        CF_RECORD_NAME: ${{ secrets.CF_RECORD_NAME }}
      run: |
        # 使用 EOF 动态创建完美的 config.json 文件
        cat <<EOF > config.json
        {
          "api_token": "$CF_API_TOKEN",
          "zone_id": "$CF_ZONE_ID",
          "records": [
            {
              "name": "$CF_RECORD_NAME",
              "type": "A",
              "ttl": 60,
              "proxied": false
            }
          ],
          "max_ips": 3,
          "tele_token": "",
          "tele_chat_id": ""
        }
        EOF
        
        # 配置文件生成后，紧接着运行优选脚本
        python main.py
